name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    # macos-26 ships multiple Xcodes; we pick the newest installed below so
    # Swift matches Package.swift's swift-tools-version (6.3). The default
    # xcode-select on the image is currently 26.4.1 / Swift 6.2.3, which is
    # too old.
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Select Xcode with Swift 6.3
      # Package.swift requires swift-tools-version 6.3. On macos-26 the
      # default xcode-select is Xcode 26.2 (Swift 6.2.x); only Xcode 26.5+
      # ships Swift 6.3, currently only available as a beta on the image.
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Show toolchain versions
      run: |
        xcodebuild -version
        swift --version

    - name: Build package
      run: swift build -v

    - name: Run tests
      run: swift test -v

  build-platforms:
    name: Build for ${{ matrix.platform }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
            scheme: AmazonAdsCore
          - platform: macOS
            destination: 'platform=macOS'
            scheme: AmazonAdsCore
          - platform: tvOS
            destination: 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=latest'
            scheme: AmazonAdsCore

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Select Xcode with Swift 6.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    # Xcode 26.5 beta ships without pre-installed iOS/tvOS 26.5 simulator
    # runtimes on macos-26 (image bundles 26.1/26.2/26.4). Download the
    # matching platform before the build. macOS doesn't need this.
    - name: Download platform runtime
      if: matrix.platform != 'macOS'
      run: sudo xcodebuild -downloadPlatform ${{ matrix.platform }}

    - name: Build for ${{ matrix.platform }}
      run: |
        xcodebuild build \
          -scheme ${{ matrix.scheme }} \
          -destination '${{ matrix.destination }}' \
          -skipPackagePluginValidation

  lint:
    name: Lint
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Check formatting
      run: |
        if command -v swiftformat &> /dev/null; then
          swiftformat --lint Sources Tests || echo "SwiftFormat issues found"
        else
          echo "SwiftFormat not installed, skipping"
        fi
